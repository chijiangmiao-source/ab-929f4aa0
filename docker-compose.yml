services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: buoy-anchor:latest
    container_name: buoy-server
    environment:
      DB_PATH: /data/buoy.db
      PORT: "8080"
      THREADS: "16"
    ports:
      # Host port is configurable: HOST_PORT=9000 docker compose up -d server
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - buoy-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  # Verification harness. Builds its own image, waits for the server to be
  # healthy, then runs code tests + production image build check + a two-phase
  # HTTP smoke test that restarts the server container mid-sequence. It exits
  # with code 0 on success and non-zero on the first failed step.
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: buoy-anchor-verify:latest
    container_name: buoy-verify
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: http://server:8080
      SERVER_CONTAINER: buoy-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"

volumes:
  buoy-data:
